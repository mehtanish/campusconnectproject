# ======================
# CampusPulse Application (Production)
# ======================
spring.application.name=CampusPulse
app.seed.demo-data=false
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.roll-no=${BOOTSTRAP_ADMIN_ROLL_NO:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# ======================
# PostgreSQL Database
# ======================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# ======================
# JPA / Hibernate
# ======================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ======================
# JWT Configuration
# ======================
app.jwt.secret=${JWT_SECRET:campusPulseSecretKeyForJWTAuthenticationThatIsAtLeast256BitsLong2024!}
app.jwt.expiration-ms=86400000

# ======================
# File Upload
# ======================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# ======================
# CORS
# ======================
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# ======================
# Server
# ======================
server.port=${PORT:8080}
