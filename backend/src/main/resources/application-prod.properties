# ======================
# CampusPulse Application (Production)
# ======================
spring.application.name=CampusPulse

# ======================
# PostgreSQL Database
# ======================
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ======================
# JPA / Hibernate
# ======================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ======================
# JWT Configuration
# ======================
# It is highly recommended to override the JWT secret using an environment variable
app.jwt.secret=${JWT_SECRET:campusPulseSecretKeyForJWTAuthenticationThatIsAtLeast256BitsLong2024!}
app.jwt.expiration-ms=86400000

# ======================
# File Upload
# ======================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# ======================
# CORS
# ======================
app.cors.allowed-origins=${FRONTEND_URL}

# ======================
# Server
# ======================
server.port=${PORT:8080}
