# ======================
# CampusPulse Application
# ======================
spring.application.name=CampusPulse

# ======================
# H2 Database (Dev Profile)
# ======================
spring.datasource.url=jdbc:h2:file:./data/campuspulse;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ======================
# JPA / Hibernate
# ======================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ======================
# JWT Configuration
# ======================
app.jwt.secret=campusPulseSecretKeyForJWTAuthenticationThatIsAtLeast256BitsLong2024!
app.jwt.expiration-ms=86400000

# ======================
# File Upload
# ======================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# ======================
# CORS
# ======================
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# ======================
# Server
# ======================
server.port=${PORT:8081}

